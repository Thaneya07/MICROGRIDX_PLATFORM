[project]
name = "microgridx-backend"
version = "0.1.0"
description = "MicroGridX Smart Energy Monitoring and Management Platform - Backend (Phase 1 Foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "psycopg2-binary>=2.9.9,<2.10.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "scikit-learn>=1.5.2,<1.6.0",
    "joblib>=1.4.2,<1.5.0",
    "numpy>=1.26.4,<2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.2,<0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
